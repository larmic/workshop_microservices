name: Docker Build & Push Go-Services

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      # Folien gehören zur Pages-Pipeline (deploy-pages.yml), nicht zum Docker-Build
      - '!services/slides/**'
  # Auf Pull Requests (auch von Renovate) nur bauen, nicht pushen: So sind
  # Kotlin/Gradle- und Basis-Image-Updates vor dem Automerge geprüft.
  pull_request:
    paths:
      - 'services/**'
      - '!services/slides/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      flight: ${{ steps.filter.outputs.flight == 'true' || github.event_name == 'workflow_dispatch' }}
      hotel: ${{ steps.filter.outputs.hotel == 'true' || github.event_name == 'workflow_dispatch' }}
      car: ${{ steps.filter.outputs.car == 'true' || github.event_name == 'workflow_dispatch' }}
      booking: ${{ steps.filter.outputs.booking == 'true' || github.event_name == 'workflow_dispatch' }}
      booking-custom: ${{ steps.filter.outputs.booking-custom == 'true' || github.event_name == 'workflow_dispatch' }}
      dashboard: ${{ steps.filter.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            flight:
              - 'services/flight/**'
              - 'services/shared/**'
              - 'services/go.mod'
              - 'services/go.sum'
              - 'services/Dockerfile'
            hotel:
              - 'services/hotel/**'
              - 'services/shared/**'
              - 'services/go.mod'
              - 'services/go.sum'
              - 'services/Dockerfile'
            car:
              - 'services/car/**'
              - 'services/shared/**'
              - 'services/go.mod'
              - 'services/go.sum'
              - 'services/Dockerfile'
            booking:
              - 'services/booking/story1/**'
              - 'services/booking/story3/**'
              - 'services/booking/story4/**'
              - 'services/booking/story5/**'
              - 'services/booking/story6/**'
              - 'services/booking/story7/**'
              - 'services/booking/story8/**'
              - 'services/shared/**'
              - 'services/go.mod'
              - 'services/go.sum'
              - 'services/Dockerfile'
            booking-custom:
              - 'services/booking/custom/**'
            dashboard:
              - 'services/dashboard/**'
              - 'services/shared/**'
              - 'services/go.mod'
              - 'services/go.sum'

  gates:
    name: Guard-Gates
    uses: ./.github/workflows/gates.yml

  build-flight:
    needs: [changes, gates]
    if: needs.changes.outputs.flight == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: services
          file: services/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          build-args: |
            SERVICE_PATH=flight
            SERVICE_DESC=Workshop Microservices - Flight Service
            SERVICE_PORT=8081
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'larmic' }}/workshop-microservices-flight:latest

  build-hotel:
    needs: [changes, gates]
    if: needs.changes.outputs.hotel == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: services
          file: services/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          build-args: |
            SERVICE_PATH=hotel
            SERVICE_DESC=Workshop Microservices - Hotel Service
            SERVICE_PORT=8082
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'larmic' }}/workshop-microservices-hotel:latest

  build-car:
    needs: [changes, gates]
    if: needs.changes.outputs.car == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: services
          file: services/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          build-args: |
            SERVICE_PATH=car
            SERVICE_DESC=Workshop Microservices - Car Service
            SERVICE_PORT=8083
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'larmic' }}/workshop-microservices-car:latest

  build-booking:
    needs: [changes, gates]
    if: needs.changes.outputs.booking == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        story: [1, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: services
          file: services/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          build-args: |
            SERVICE_PATH=booking/story${{ matrix.story }}
            SERVICE_DESC=Workshop Microservices - Booking Service (Story ${{ matrix.story }})
            SERVICE_PORT=8080
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'larmic' }}/workshop-microservices-booking:story${{ matrix.story }}

  build-dashboard:
    needs: [changes, gates]
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Easteregg-Webhook ist optional: ohne Secret baut das Image trotzdem,
      # die Discord-Benachrichtigung unterbleibt dann einfach.
      - name: Check easteregg webhook secret
        if: github.event_name != 'pull_request'
        env:
          HOOK: ${{ secrets.DISCORD_EASTEREGG_WEBHOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::Secret DISCORD_EASTEREGG_WEBHOOK_URL ist nicht gesetzt - das Inselwelt-Easteregg sendet keine Discord-Benachrichtigung."
          fi
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: services
          file: services/dashboard/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          build-args: |
            DISCORD_EASTEREGG_WEBHOOK_URL=${{ github.event_name != 'pull_request' && secrets.DISCORD_EASTEREGG_WEBHOOK_URL || '' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'larmic' }}/workshop-microservices-dashboard:latest

  build-booking-custom:
    needs: [changes, gates]
    if: needs.changes.outputs.booking-custom == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: services/booking/custom
          file: services/booking/custom/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'larmic' }}/workshop-microservices-booking:custom
