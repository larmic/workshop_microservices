<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Vorbereitung &middot; Microservices richtig gemacht</title>
    <link rel="icon" type="image/png" href="../feedback/icon.png">
    <style>
        :root {
            --primary-dark: #0A0349;
            --primary-violet: #7348E1;
            --highlight: #D3F871;
            --wave: #EEE7FB;
            --line: #e0e0e6;
            --muted: #888;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--primary-dark);
            background: var(--primary-dark);
            background-image: linear-gradient(160deg, var(--primary-dark) 0%, #1a0d6e 100%);
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 1.25rem;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
            max-width: 820px;
            width: 100%;
            padding: 1.5rem 2rem;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--line);
            font-size: 0.9rem;
        }
        .topbar .back {
            color: var(--primary-violet);
            text-decoration: none;
            font-weight: 700;
        }
        .topbar .back:hover { text-decoration: underline; }
        /* Doku-Typografie für gerendertes Markdown */
        #content { line-height: 1.65; }
        #content h1 { font-size: 1.7rem; margin: 0.5rem 0 1rem; }
        #content h2 {
            font-size: 1.35rem;
            margin-top: 2.25rem;
            padding-bottom: 0.3rem;
            border-bottom: 1px solid var(--line);
        }
        #content h3 { font-size: 1.1rem; margin-top: 1.5rem; }
        #content a { color: var(--primary-violet); }
        #content code {
            background: var(--wave);
            padding: 0.1rem 0.35rem;
            border-radius: 4px;
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            font-size: 0.88em;
        }
        #content pre {
            background: var(--primary-dark);
            color: #e0e6f0;
            padding: 1rem 1.25rem;
            border-radius: 8px;
            overflow-x: auto;
        }
        #content pre code { background: none; color: inherit; padding: 0; }
        #content table {
            border-collapse: collapse;
            width: 100%;
            margin: 1rem 0;
            font-size: 0.92em;
        }
        #content th, #content td {
            border: 1px solid var(--line);
            padding: 0.45rem 0.65rem;
            text-align: left;
        }
        #content th { background: var(--primary-dark); color: #fff; }
        #content tbody tr:nth-child(even) { background: var(--wave); }
        /* Code-Chips auf lila Flächen weiß, sonst verschwinden sie. */
        #content tbody tr:nth-child(even) code,
        #content blockquote code { background: #fff; }
        #content blockquote {
            margin: 1rem 0;
            padding: 0.6rem 1rem;
            border-left: 4px solid var(--primary-violet);
            background: var(--wave);
            border-radius: 0 8px 8px 0;
        }
        #content blockquote p { margin: 0.25rem 0; }
        #content blockquote ul { margin: 0.25rem 0; padding-left: 1.2rem; }
        /* Kasten mit Titelzeile (> **Titel** + Zeilenumbruch), lime = gut zu wissen */
        #content blockquote.callout strong.callout-title { display: block; }
        #content blockquote.callout-lime {
            border-left-color: var(--highlight);
            background: rgba(211, 248, 113, 0.15);
        }
        #content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            border: 1px solid var(--line);
        }
        /* Checkbox absolut links, damit Umbrüche unter dem Text weiterlaufen. */
        #content li:has(> input[type="checkbox"]) {
            list-style: none;
            position: relative;
            margin-left: -1.2em;
            padding-left: 1.7em;
        }
        #content li > input[type="checkbox"] {
            position: absolute;
            left: 0;
            top: 0.4em;
            margin: 0;
            accent-color: var(--primary-violet);
        }

        /* Seite mit Leiste links: Schritte, Fortschritt, Hilfe */
        .card.with-side { max-width: 1140px; }
        .layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 2.25rem; align-items: start; }
        .prep-side {
            position: sticky;
            top: 1.25rem;
            max-height: calc(100vh - 2.5rem);
            overflow-y: auto;
            font-size: 0.88rem;
            padding: 0.25rem 0.25rem 1rem 0;
        }
        .prep-side:empty { display: none; }
        @media (max-width: 900px) {
            .layout { grid-template-columns: minmax(0, 1fr); }
            .prep-side { position: static; max-height: none; }
        }
        .side-title { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #5B4E93; margin: 0.5rem 0 0.4rem; }
        .side-progress { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 0.3rem; }
        .side-progress span { font-weight: 400; color: #5B4E93; }
        .side-bar { height: 6px; border-radius: 3px; background: var(--wave); overflow: hidden; margin-bottom: 0.9rem; }
        .side-bar > i { display: block; height: 100%; width: 0; background: var(--primary-violet); transition: width 0.2s; }
        .side-steps { list-style: none; margin: 0; padding: 0; }
        .side-steps a {
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
            padding: 0.4rem 0.5rem;
            border-radius: 8px;
            color: var(--primary-dark);
            text-decoration: none;
        }
        .side-steps a:hover { background: var(--wave); }
        .side-dot {
            flex: none;
            width: 1.7rem;
            height: 1.7rem;
            border-radius: 50%;
            border: 2px solid #c9c9d6;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
        }
        .side-text { display: flex; flex-direction: column; line-height: 1.3; padding-top: 0.15rem; }
        .side-text small { color: #5B4E93; font-size: 0.75rem; }
        .side-steps a.active { background: var(--wave); }
        .side-steps a.active .side-dot { background: var(--primary-dark); border-color: var(--primary-dark); color: var(--highlight); box-shadow: 0 0 0 3px var(--highlight); }
        .side-steps a.done .side-dot { background: #1d7a3a; border-color: #1d7a3a; color: #fff; }
        .side-steps a.done small { color: #1d7a3a; }
        .side-help { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); padding-top: 0.4rem; }
        .side-help a { display: block; padding: 0.22rem 0.5rem; border-radius: 6px; color: var(--primary-dark); text-decoration: none; line-height: 1.35; }
        .side-help a:hover { background: var(--wave); }
        .side-help a.active { background: var(--wave); font-weight: 600; }
        .side-help .side-sub { padding-left: 1.2rem; font-size: 0.82rem; }
        .side-help .side-group { padding: 0.4rem 0.5rem 0.1rem; color: #5B4E93; font-size: 0.75rem; font-weight: 700; }
        .prep-help > h2 { margin-top: 3rem; }
        #content li > input[type="checkbox"]:not(:disabled) { cursor: pointer; }
        /* Hilfe: aufklappbare Einträge aus troubleshooting.md */
        .help-box, .ts-entry {
            border: 1px solid var(--line);
            border-radius: 8px;
            margin: 0.75rem 0;
            background: #fff;
        }
        .help-box { border-left: 4px solid #b3261e; padding: 0.25rem 0.9rem 0.6rem; }
        .help-box > summary { cursor: pointer; padding: 0.4rem 0; }
        .help-box > summary span { color: #5B4E93; font-size: 0.85rem; margin-left: 0.3rem; }
        .help-box .ts-entry { margin: 0.4rem 0; }
        .help-all { display: inline-block; margin-top: 0.3rem; font-size: 0.85rem; }
        .ts-entry > summary { cursor: pointer; padding: 0.55rem 0.9rem; font-weight: 600; }
        .ts-entry > summary code { font-weight: 600; }
        .ts-entry[open] > summary { border-bottom: 1px solid var(--line); }
        .ts-body { padding: 0.25rem 0.9rem 0.75rem; }
        .ts-tag {
            margin-left: 0.5rem;
            padding: 0.05rem 0.5rem;
            border-radius: 999px;
            background: var(--primary-dark);
            color: var(--highlight);
            font-size: 0.72rem;
            font-weight: 700;
            vertical-align: middle;
        }
        .ts-intro > summary { font-weight: 400; color: #5B4E93; font-size: 0.9rem; }
        .status-box {
            padding: 1rem 1.25rem;
            border-radius: 8px;
            background: var(--wave);
        }
        .status-box.error { background: #fde0e0; color: #b3261e; }
        .status-box.error a { color: #b3261e; font-weight: 700; }

        /* Footer wie im Workshop-Dashboard */
        .workshop-footer {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #d0d7e2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            font-size: 0.85rem;
            color: #555;
        }
        .workshop-footer .footer-author strong { color: #0A0349; }
        .workshop-footer .footer-author .accent {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            background: #CCF465;
            color: #0A0349;
            font-weight: 700;
            margin-right: 0.4rem;
        }
        .workshop-footer .footer-logo {
            height: 32px;
            width: auto;
            opacity: 0.8;
            transition: opacity 0.15s;
        }
        .workshop-footer .footer-logo:hover { opacity: 1; }
    </style>
</head>
<body>
    <main class="card with-side" role="main">
        <div class="topbar">
            <a class="back" href="../">&larr; Zur &Uuml;bersicht</a>
        </div>

        <noscript>
            <div class="status-box">
                Diese Seite ben&ouml;tigt JavaScript. Die Anleitung steht auch direkt im Repo:
                <a href="https://github.com/larmic/workshop_microservices/blob/main/docs/vorbereitung.md">docs/vorbereitung.md auf GitHub</a>
            </div>
        </noscript>

        <div class="layout">
            <aside class="prep-side" id="prep-side" aria-label="Schritte und Hilfe"></aside>
            <article id="content" aria-live="polite"></article>
        </div>

        <footer class="workshop-footer">
            <div class="footer-author">
                <span class="accent">Workshop</span> von <strong>Lars Michaelis</strong>
            </div>
            <a href="https://www.team-neusta.de/" target="_blank" rel="noopener" aria-label="team neusta">
                <img class="footer-logo" src="../assets/team-neusta-logo.svg" alt="team neusta">
            </a>
        </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script>
        // Rendert docs/vorbereitung.md als eine Seite mit Leiste links (Schritte,
        // Fortschritt, Hilfe) und hängt docs/troubleshooting.md als Abschnitt
        // "Hilfe" an. Beide Dateien werden im Pages-Build unverändert hierher
        // kopiert und bleiben auf GitHub normale Dokumente.
        //
        // Konventionen im Markdown:
        //  - Jede "##"-Überschrift ist ein Schritt. Ein Kommentar
        //    "<!-- schritt: Kurzname -->" darunter liefert das Label in der Leiste.
        //  - "## Bei Problemen" ist kein Schritt, sondern der Kopf der Hilfe.
        //  - "> **Klappt nicht?**" mit Links auf troubleshooting.md#anker wird
        //    zu einer aufklappbaren Box mit genau diesen Einträgen.
        const REPO_BLOB = "https://github.com/larmic/workshop_microservices/blob/main/docs/";
        const CHECK_KEY = "workshop-vorbereitung.checks.v1";
        const HELP_HEADING = /^Bei Problemen/;

        const content = document.getElementById("content");
        const steps = [];          // { section, label, heading, number, link, boxes }
        const tsEntries = {};      // Anker -> { title, body } aus troubleshooting.md

        function showError() {
            content.innerHTML = "";
            const box = document.createElement("div");
            box.className = "status-box error";
            box.innerHTML = "Die Anleitung konnte nicht geladen werden. Sie steht auch direkt im Repo: " +
                '<a href="' + REPO_BLOB + 'vorbereitung.md" rel="noopener">vorbereitung.md auf GitHub</a>';
            content.appendChild(box);
        }

        // Anker wie auf GitHub: Kleinbuchstaben, Satzzeichen weg, jedes
        // Leerzeichen ein Bindestrich. So gelten dieselben Links auf GitHub
        // und hier.
        function slugify(text) {
            return text.trim().toLowerCase()
                .replace(/[^\p{L}\p{N}\s_-]/gu, "")
                .replace(/\s/g, "-");
        }

        function parse(md) {
            const div = document.createElement("div");
            div.innerHTML = marked.parse(md);
            return div;
        }

        // Teilt gerendertes HTML an jeder h2: [kopf, [h2, ...inhalt], ...]
        function splitAtH2(root) {
            const head = [];
            const parts = [];
            for (const el of Array.from(root.childNodes)) {
                if (el.nodeName === "H2") parts.push([el]);
                else if (parts.length) parts[parts.length - 1].push(el);
                else head.push(el);
            }
            return { head, parts };
        }

        function fixLinksAndImages(root) {
            root.querySelectorAll("a").forEach((a) => {
                const raw = a.getAttribute("href") || "";
                if (/^(https?:|mailto:)/i.test(raw)) {
                    a.target = "_blank";
                    a.rel = "noopener";
                    return;
                }
                if (raw.startsWith("#")) return;
                const clean = raw.replace(/^\.\//, "");
                const [path, hash] = clean.split("#");
                if (path === "troubleshooting.md") a.href = "#" + (hash || "hilfe");
                else if (path === "vorbereitung.md") a.href = "#" + (hash || "schritt-0");
                else {
                    a.href = REPO_BLOB + clean;
                    a.target = "_blank";
                    a.rel = "noopener";
                }
            });
            root.querySelectorAll("img").forEach((img) => {
                const src = img.getAttribute("src") || "";
                if (!/^https?:/i.test(src)) img.src = "./" + src.replace(/^\.\//, "");
                img.loading = "lazy";
            });
        }

        // Kästen: Steht der fette Titel allein in der ersten Zeile, wird er
        // zur Titelzeile. "Mehr nicht" und "Gut zu wissen" bekommen den
        // lime Strich, alle anderen bleiben violett.
        function styleCallouts(root) {
            root.querySelectorAll("blockquote").forEach((q) => {
                const first = q.querySelector(":scope > p:first-child");
                const title = first && first.firstElementChild;
                if (!title || title.tagName !== "STRONG" || first.firstChild !== title) return;
                const next = title.nextSibling;
                if (next && !(next.nodeType === Node.TEXT_NODE && next.textContent.startsWith("\n"))) return;
                q.classList.add("callout");
                title.classList.add("callout-title");
                if (/^(Mehr nicht|Gut zu wissen)/.test(title.textContent)) q.classList.add("callout-lime");
            });
        }

        function entryDetails(anchor, withId) {
            const entry = tsEntries[anchor];
            const d = document.createElement("details");
            d.className = "ts-entry";
            if (withId) d.id = anchor;
            const sum = document.createElement("summary");
            sum.innerHTML = entry.title;
            if (/Windows/.test(sum.textContent)) {
                const tag = document.createElement("span");
                tag.className = "ts-tag";
                tag.textContent = "Windows";
                sum.appendChild(tag);
            }
            d.appendChild(sum);
            const body = document.createElement("div");
            body.className = "ts-body";
            body.innerHTML = entry.body;
            if (!withId) body.querySelectorAll("[id]").forEach((el) => el.removeAttribute("id"));
            d.appendChild(body);
            return d;
        }

        // "> **Klappt nicht?**" wird zur Box mit den verlinkten Einträgen.
        function buildHelpBoxes(root) {
            root.querySelectorAll("blockquote.callout").forEach((q) => {
                const title = q.querySelector(".callout-title");
                if (!title || !/^Klappt nicht/.test(title.textContent)) return;
                const anchors = Array.from(q.querySelectorAll("a"))
                    .map((a) => decodeURIComponent((a.getAttribute("href") || "").replace(/^#/, "")))
                    .filter((h) => tsEntries[h]);
                if (!anchors.length) return; // Troubleshooting nicht geladen: Links bleiben
                const box = document.createElement("details");
                box.className = "help-box";
                box.innerHTML = '<summary><strong>Klappt nicht?</strong> <span>' + anchors.length +
                    (anchors.length === 1 ? " Hilfe" : " Hilfen") + "</span></summary>";
                anchors.forEach((a) => box.appendChild(entryDetails(a, false)));
                const all = document.createElement("a");
                all.className = "help-all";
                all.href = "#hilfe";
                all.textContent = "Alle Probleme in der Hilfe →";
                box.appendChild(all);
                q.replaceWith(box);
            });
        }

        function loadChecks() {
            try { return JSON.parse(localStorage.getItem(CHECK_KEY)) || {}; } catch (_) { return {}; }
        }
        function saveChecks(state) {
            try { localStorage.setItem(CHECK_KEY, JSON.stringify(state)); } catch (_) {}
        }
        // Checkboxen klickbar machen und den Stand pro Browser merken.
        function wireChecks() {
            const state = loadChecks();
            steps.forEach((step, i) => {
                step.boxes = Array.from(step.section.querySelectorAll('input[type="checkbox"]'));
                step.boxes.forEach((box, j) => {
                    const key = i + "-" + j;
                    box.disabled = false;
                    box.checked = !!state[key];
                    box.addEventListener("change", () => {
                        state[key] = box.checked;
                        saveChecks(state);
                        updateProgress();
                    });
                });
            });
            updateProgress();
        }

        // Fortschritt in der Leiste: gesamt oben, pro Schritt am Eintrag.
        function updateProgress() {
            let all = 0, done = 0;
            steps.forEach((step) => {
                const n = step.boxes.length;
                const k = step.boxes.filter((b) => b.checked).length;
                all += n;
                done += k;
                step.link.classList.toggle("done", n > 0 && k === n);
                step.dot.textContent = n > 0 && k === n ? "✓" : step.number;
                step.sub.textContent = n === 0 ? "" : k === n ? "erledigt" : k + " / " + n + " erledigt";
            });
            side.querySelector(".side-progress b").textContent = done + " / " + all + " erledigt";
            side.querySelector(".side-bar > i").style.width = (all ? Math.round(100 * done / all) : 0) + "%";
        }

        function buildSide(helpLinks) {
            side.innerHTML = '<p class="side-title">Vorbereitung</p>' +
                '<p class="side-progress"><b></b><span>Checklisten</span></p><div class="side-bar"><i></i></div>';
            const list = document.createElement("ul");
            list.className = "side-steps";
            steps.forEach((step) => {
                const li = document.createElement("li");
                const a = document.createElement("a");
                a.href = "#" + step.heading.id;
                a.innerHTML = '<span class="side-dot"></span><span class="side-text"><span></span><small></small></span>';
                a.querySelector(".side-text > span").textContent = step.label;
                step.link = a;
                step.dot = a.querySelector(".side-dot");
                step.sub = a.querySelector("small");
                li.appendChild(a);
                list.appendChild(li);
            });
            side.appendChild(list);
            const title = document.createElement("p");
            title.className = "side-title";
            title.textContent = "Hilfe";
            side.appendChild(title);
            const help = document.createElement("ul");
            help.className = "side-help";
            let windowsGroup = false;
            helpLinks.forEach(({ anchor, text }) => {
                const isWin = /^Nur Windows\/WSL2:\s*/.test(text);
                if (isWin && !windowsGroup) {
                    const g = document.createElement("li");
                    g.className = "side-group";
                    g.textContent = "Nur Windows/WSL2";
                    help.appendChild(g);
                    windowsGroup = true;
                }
                const li = document.createElement("li");
                const a = document.createElement("a");
                a.href = "#" + anchor;
                a.textContent = text.replace(/^Nur Windows\/WSL2:\s*/, "").replace(/\s*\(.*\)$/, "");
                if (isWin) a.className = "side-sub";
                li.appendChild(a);
                help.appendChild(li);
            });
            side.appendChild(help);
        }

        // Scrollspy: markiert den Schritt bzw. Hilfe-Eintrag, der gerade oben steht.
        function watchScroll() {
            const targets = steps.map((s) => ({ el: s.section, link: s.link }));
            side.querySelectorAll(".side-help a").forEach((a) => {
                const el = document.getElementById(decodeURIComponent(a.getAttribute("href").slice(1)));
                if (el) targets.push({ el, link: a });
            });
            const update = () => {
                let current = null;
                for (const t of targets) {
                    if (t.el.getBoundingClientRect().top <= 120) current = t;
                }
                if (!current) current = targets[0];
                targets.forEach((t) => t.link.classList.toggle("active", t === current));
            };
            window.addEventListener("scroll", update, { passive: true });
            update();
        }

        // Anker anspringen; liegt das Ziel in einem zugeklappten Eintrag, aufklappen.
        function route() {
            const hash = decodeURIComponent(location.hash.slice(1));
            const target = hash && document.getElementById(hash);
            if (!target) return;
            const d = target.closest("details");
            if (d) d.open = true;
            target.scrollIntoView();
        }

        async function fetchText(name) {
            const res = await fetch("./" + name, { cache: "no-cache" });
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.text();
        }

        const side = document.getElementById("prep-side");

        async function load() {
            if (typeof marked === "undefined") return showError(); // CDN nicht erreichbar
            content.innerHTML = '<div class="status-box">Lade Anleitung &hellip;</div>';
            marked.setOptions({ gfm: true, breaks: false });
            let prepMd, tsMd = null;
            try { prepMd = await fetchText("vorbereitung.md"); } catch (_) { return showError(); }
            try { tsMd = await fetchText("troubleshooting.md"); } catch (_) {}

            const prep = splitAtH2(parse(prepMd));
            const out = document.createDocumentFragment();
            prep.head.forEach((n) => out.appendChild(n));

            let helpHead = null;
            prep.parts.forEach((part) => {
                const h2 = part[0];
                h2.id = slugify(h2.textContent);
                if (HELP_HEADING.test(h2.textContent)) { helpHead = part; return; }
                const section = document.createElement("section");
                section.className = "prep-step";
                let label = h2.textContent.replace(/^\d+\.\s*/, "").replace(/\s*\(.*\)$/, "");
                part.forEach((n) => {
                    if (n.nodeType === Node.COMMENT_NODE) {
                        const m = /schritt:\s*(.+)/.exec(n.textContent);
                        if (m) label = m[1].trim();
                        return;
                    }
                    section.appendChild(n);
                });
                const m = /^(\d+)\./.exec(h2.textContent);
                steps.push({ section, label, heading: h2, number: m ? m[1] : "0" });
                out.appendChild(section);
            });

            // Hilfe: "Bei Problemen" plus troubleshooting.md, jede h2 ein Eintrag.
            const hsec = document.createElement("section");
            hsec.className = "prep-help";
            hsec.id = "hilfe";
            const hh = document.createElement("h2");
            hh.id = "bei-problemen";
            hh.textContent = "Hilfe bei Problemen";
            hsec.appendChild(hh);
            if (helpHead) helpHead.slice(1).forEach((n) => hsec.appendChild(n));
            const helpLinks = [];
            if (tsMd) {
                const ts = splitAtH2(parse(tsMd));
                ts.parts.forEach((part) => {
                    const anchor = slugify(part[0].textContent);
                    const body = document.createElement("div");
                    part.slice(1).forEach((n) => body.appendChild(n));
                    styleCallouts(body);
                    fixLinksAndImages(body);
                    tsEntries[anchor] = { title: part[0].innerHTML, body: body.innerHTML };
                    helpLinks.push({ anchor, text: part[0].textContent });
                });
                helpLinks.forEach(({ anchor }, i) => {
                    const d = entryDetails(anchor, true);
                    if (i === 0) d.open = true; // "Erste Diagnose"
                    hsec.appendChild(d);
                });
                const intro = document.createElement("details");
                intro.className = "ts-entry ts-intro";
                intro.innerHTML = "<summary>So liest du die Einträge (Ports, Geltung, Status)</summary>";
                const ib = document.createElement("div");
                ib.className = "ts-body";
                ts.head.filter((n) => n.nodeName !== "H1").forEach((n) => ib.appendChild(n));
                intro.appendChild(ib);
                hsec.appendChild(intro);
            } else {
                const p = document.createElement("p");
                p.innerHTML = 'Die Hilfe konnte nicht geladen werden: <a href="' + REPO_BLOB +
                    'troubleshooting.md" target="_blank" rel="noopener">troubleshooting.md auf GitHub</a>';
                hsec.appendChild(p);
            }
            out.appendChild(hsec);

            content.innerHTML = "";
            content.appendChild(out);
            content.querySelectorAll("h1, h3, h4").forEach((h) => { if (!h.id) h.id = slugify(h.textContent); });
            styleCallouts(content);
            fixLinksAndImages(content);
            buildHelpBoxes(content);
            buildSide(helpLinks);
            wireChecks();
            watchScroll();

            // Alte Links auf den Troubleshooting-Tab landen in der Hilfe.
            if (new URLSearchParams(location.search).get("doc") === "troubleshooting.md" && !location.hash) {
                history.replaceState(null, "", "./#hilfe");
            }
            window.addEventListener("hashchange", route);
            route();
        }

        load();
    </script>
</body>
</html>
