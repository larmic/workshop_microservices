openapi: 3.0.3
info:
  title: BookingService API
  description: |
    REST API for the BookingService that orchestrates Flight, Hotel and Car
    backend services and exposes health and configuration endpoints.
  version: 1.0.0

servers:
  - url: http://localhost/api/booking-custom
    description: API-Gateway (Traefik)
paths:
  /health:
    get:
      summary: Health check
      description: Returns HTTP 200 when the service is healthy.
      operationId: getHealth
      tags:
        - monitoring
      responses:
        "200":
          description: Service is healthy

  /info:
    get:
      summary: Service configuration info
      description: Returns the current service configuration without sensitive data.
      operationId: getInfo
      tags:
        - monitoring
      responses:
        "200":
          description: Current configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoResponse"

  /openapi:
    get:
      summary: OpenAPI specification
      description: Returns the OpenAPI specification of this service
      operationId: getOpenApi
      tags:
        - monitoring
      responses:
        "200":
          description: OpenAPI specification
          content:
            text/yaml:
              schema:
                type: string

  /booking/offers:
    get:
      summary: Combined booking offers
      description: |
        Calls the Flight, Hotel and Car backend services and returns their
        combined results. No error handling — the request may fail if a
        backend service is unavailable.
      operationId: getBookingOffers
      tags:
        - booking
      responses:
        "200":
          description: Combined offers from all backend services
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingOffers"

components:
  schemas:
    InfoResponse:
      type: object
      properties:
        flightServiceUrl:
          type: string
          example: http://localhost:8081
        hotelServiceUrl:
          type: string
          example: http://localhost:8082
        carServiceUrl:
          type: string
          example: http://localhost:8083
      required:
        - flightServiceUrl
        - hotelServiceUrl
        - carServiceUrl

    BookingOffers:
      type: object
      properties:
        flights:
          type: array
          items:
            $ref: "#/components/schemas/Flight"
        hotels:
          type: array
          items:
            $ref: "#/components/schemas/Hotel"
        cars:
          type: array
          items:
            $ref: "#/components/schemas/Car"
      required:
        - flights
        - hotels
        - cars

    Flight:
      type: object
      properties:
        id:
          type: string
          example: LH123
        origin:
          type: string
          example: Frankfurt
        destination:
          type: string
          example: New York
        price:
          type: number
          format: float
          example: 450
        currency:
          type: string
          example: EUR

    Hotel:
      type: object
      properties:
        id:
          type: string
          example: H1
        name:
          type: string
          example: Grand Hotel Berlin
        price:
          type: number
          format: float
          example: 150
        currency:
          type: string
          example: EUR
        unit:
          type: string
          example: night

    Car:
      type: object
      properties:
        id:
          type: string
          example: C1
        model:
          type: string
          example: VW Golf
        price:
          type: number
          format: float
          example: 45
        currency:
          type: string
          example: EUR
        unit:
          type: string
          example: day
