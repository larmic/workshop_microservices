<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Booking ruft Flight, Hotel und Car nacheinander auf; Hotel scheitert, ein Pfeil führt von Hotel zurück zu Flight: die Kompensation">
  <!-- Booking links -->
  <rect x="24" y="118" width="100" height="64" rx="12" fill="none" stroke="#B4A9E6" stroke-width="4"/>
  <rect x="42" y="140" width="64" height="10" rx="5" fill="#6E63A8"/>
  <rect x="42" y="158" width="40" height="10" rx="5" fill="#6E63A8"/>
  <!-- Forward: Booking -> Flight -->
  <path d="M 130 150 L 170 150" fill="none" stroke="#B4A9E6" stroke-width="4" stroke-linecap="round"/>
  <path d="M 162 141 L 176 150 L 162 159 Z" fill="#B4A9E6"/>
  <!-- Flight: gebucht -->
  <rect x="180" y="118" width="110" height="64" rx="12" fill="none" stroke="#B4A9E6" stroke-width="4"/>
  <rect x="198" y="140" width="60" height="10" rx="5" fill="#6E63A8"/>
  <rect x="198" y="158" width="40" height="10" rx="5" fill="#6E63A8"/>
  <circle cx="271" cy="134" r="7" fill="#D3F871"/>
  <!-- Forward: Flight -> Hotel -->
  <path d="M 296 150 L 336 150" fill="none" stroke="#B4A9E6" stroke-width="4" stroke-linecap="round"/>
  <path d="M 328 141 L 342 150 L 328 159 Z" fill="#B4A9E6"/>
  <!-- Hotel: scheitert -->
  <rect x="346" y="118" width="110" height="64" rx="12" fill="none" stroke="#B4A9E6" stroke-width="4"/>
  <rect x="364" y="140" width="60" height="10" rx="5" fill="#6E63A8"/>
  <rect x="364" y="158" width="40" height="10" rx="5" fill="#6E63A8"/>
  <circle cx="437" cy="134" r="7" fill="#C2405C"/>
  <path d="M 384 190 L 418 224 M 418 190 L 384 224" fill="none" stroke="#C2405C" stroke-width="5" stroke-linecap="round"/>
  <!-- Car: nicht mehr aufgerufen -->
  <path d="M 462 150 L 502 150" fill="none" stroke="#4B3F86" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8"/>
  <rect x="510" y="118" width="70" height="64" rx="12" fill="none" stroke="#B4A9E6" stroke-width="4" stroke-dasharray="10 8" opacity="0.5"/>
  <rect x="526" y="140" width="38" height="10" rx="5" fill="#4B3F86"/>
  <!-- Kompensation: Hotel -> Flight, unter der Kette zurueck -->
  <path d="M 440 232 C 440 272, 235 272, 235 200" fill="none" stroke="#D3F871" stroke-width="4" stroke-linecap="round"/>
  <path d="M 226 208 L 235 192 L 244 208 Z" fill="#D3F871"/>
  <!-- Flight nach der Kompensation: Lampe geht aus -->
  <circle cx="271" cy="134" r="7" fill="none" stroke="#D3F871" stroke-width="2"/>
</svg>
