<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 262" role="img" aria-label="Schiffsrumpf mit drei Abteilen für Flight, Hotel und Car; das Hotel-Abteil ist geflutet, Flight und Car bleiben trocken">
  <!-- Wellen links und rechts -->
  <path d="M 8 78 C 22 66, 36 66, 50 78 S 78 90, 92 78" fill="none" stroke="#B4A9E6" stroke-width="4" stroke-linecap="round"/>
  <path d="M 508 78 C 522 66, 536 66, 550 78 S 578 90, 592 78" fill="none" stroke="#B4A9E6" stroke-width="4" stroke-linecap="round"/>
  <!-- geflutetes Abteil: Hotel -->
  <clipPath id="hull"><path d="M 60 22 L 540 22 L 490 208 L 110 208 Z"/></clipPath>
  <g clip-path="url(#hull)">
    <path d="M 220 92 C 245 80, 270 104, 300 92 S 355 82, 380 92 L 380 210 L 220 210 Z" fill="#6E63A8"/>
  </g>
  <!-- Rumpf -->
  <path d="M 60 22 L 540 22 L 490 208 L 110 208 Z" fill="none" stroke="#B4A9E6" stroke-width="5" stroke-linejoin="round"/>
  <!-- Schotten -->
  <line x1="220" y1="22" x2="220" y2="208" stroke="#B4A9E6" stroke-width="4"/>
  <line x1="380" y1="22" x2="380" y2="208" stroke="#B4A9E6" stroke-width="4"/>
  <!-- Status-Punkte -->
  <circle cx="150" cy="56" r="11" fill="#D3F871"/>
  <circle cx="300" cy="56" r="11" fill="#4B3F86"/>
  <circle cx="450" cy="56" r="11" fill="#D3F871"/>
  <!-- Beschriftung pro Backend -->
  <g font-family="Poppins, sans-serif" font-size="22" font-weight="600" fill="#E4E0F5" text-anchor="middle">
    <text x="160" y="246">Flight</text>
    <text x="300" y="246">Hotel</text>
    <text x="440" y="246">Car</text>
  </g>
</svg>
