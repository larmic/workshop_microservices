<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400"
     role="img" aria-label="Ein Verzeichnis löst einen Namen auf eine von mehreren Instanzen auf; die frühere Instanz ist ausgefallen" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="sd-tip" viewBox="0 0 12 12" refX="10" refY="6"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#C6F24B"/>
    </marker>
  </defs>

  <!-- Verzeichnis: drei Namen, einer wird gerade gefragt -->
  <g id="sd-registry">
    <rect x="28" y="96" width="214" height="208" rx="24" fill="none" stroke="#8B7FC4" stroke-width="5"/>
    <rect x="60" y="132" width="150" height="28" rx="14" fill="#6E63A8"/>
    <rect x="60" y="186" width="150" height="28" rx="14" fill="#C6F24B"/>
    <rect x="60" y="240" width="150" height="28" rx="14" fill="#6E63A8"/>
  </g>

  <!-- alte Spur, die ins Leere läuft -->
  <g id="sd-stale">
    <path d="M242 200 C 302 200 302 96 366 96" fill="none" stroke="#4A3F7A"
          stroke-width="4" stroke-dasharray="12 12"/>
    <g stroke="#4A3F7A" stroke-width="5" stroke-linecap="round">
      <path d="M292 129 l22 22"/><path d="M314 129 l-22 22"/>
    </g>
  </g>

  <!-- aktuelle Auflösung -->
  <path id="sd-live" d="M242 200 L 358 200" fill="none" stroke="#C6F24B"
        stroke-width="6" stroke-linecap="round" marker-end="url(#sd-tip)"/>

  <!-- Instanzen -->
  <g id="sd-instance-down">
    <rect x="366" y="52" width="166" height="88" rx="18" fill="#241C4E" stroke="#4A3F7A"
          stroke-width="4" stroke-dasharray="14 10"/>
    <rect x="396" y="89" width="70" height="14" rx="7" fill="#3A2E72"/>
  </g>
  <g id="sd-instance-live">
    <rect x="366" y="156" width="166" height="88" rx="18" fill="none" stroke="#8B7FC4" stroke-width="5"/>
    <rect x="396" y="180" width="106" height="14" rx="7" fill="#8B7FC4"/>
    <rect x="396" y="206" width="66" height="14" rx="7" fill="#8B7FC4"/>
    <circle cx="512" cy="176" r="9" fill="#C6F24B"/>
  </g>
  <g id="sd-instance-idle">
    <rect x="366" y="260" width="166" height="88" rx="18" fill="none" stroke="#6E63A8" stroke-width="5"/>
    <rect x="396" y="284" width="106" height="14" rx="7" fill="#6E63A8"/>
    <rect x="396" y="310" width="66" height="14" rx="7" fill="#6E63A8"/>
  </g>
</svg>
