<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Sicherungskasten mit drei Schutzschaltern für Flight, Hotel und Car; der von Flight ist ausgelöst und steht unten">
  <rect x="30" y="30" width="540" height="240" rx="18" fill="none" stroke="#B4A9E6" stroke-width="5"/>
  <g>
    <rect x="90"  y="60" width="110" height="150" rx="12" fill="#5A2B4E"/>
    <rect x="245" y="60" width="110" height="150" rx="12" fill="#3A2E72"/>
    <rect x="400" y="60" width="110" height="150" rx="12" fill="#3A2E72"/>
  </g>
  <!-- Status-Lampen -->
  <circle cx="145" cy="86" r="10" fill="#C2405C"/>
  <circle cx="300" cy="86" r="10" fill="#D3F871"/>
  <circle cx="455" cy="86" r="10" fill="#D3F871"/>
  <!-- Kipphebel: oben = CLOSED, Flight unten = OPEN -->
  <rect x="127" y="148" width="36" height="52" rx="8" fill="#B4A9E6"/>
  <rect x="282" y="108" width="36" height="52" rx="8" fill="#B4A9E6"/>
  <rect x="437" y="108" width="36" height="52" rx="8" fill="#B4A9E6"/>
  <!-- Beschriftung pro Backend -->
  <g font-family="Poppins, sans-serif" font-size="22" font-weight="600" fill="#E4E0F5" text-anchor="middle">
    <text x="145" y="246">Flight</text>
    <text x="300" y="246">Hotel</text>
    <text x="455" y="246">Car</text>
  </g>
</svg>
