<!-- Welle am unteren Slide-Rand mit team neusta Logo -->
<div class="slide-wave" aria-hidden="true">
    <svg viewBox="0 0 1440 110" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path id="wave-path" class="wave-path" fill="rgb(238,231,251)" d=""/>

<script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.1/dist/reveal.js"></script>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.1/dist/plugin/markdown.js"></script>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.1/dist/plugin/highlight.js"></script>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.1/dist/plugin/notes.js"></script>
<script>
    Reveal.initialize({
        hash: true,
        slideNumber: 'c/t',
        transition: 'slide',
        controls: true,
        progress: true,
        // Festes Raster: Titelzone oben, Inhalt linksbündig, Schutzzone für die
        // Welle unten (siehe theme.css). Vertikale Zentrierung ist deshalb aus.
        center: false,
        // 16:9-Canvas: füllt moderne Beamer randlos (kein Letterboxing wie bei
        // der 960x700-Voreinstellung) und gibt den Story-Spalten echte Breite.
        width: 1280,
        height: 720,
        plugins: [RevealMarkdown, RevealHighlight, RevealNotes]
    });

    // Welle: voll-breit. Der Peak (höchster Punkt) wandert von links nach
    // rechts entlang des Slide-Fortschritts. Path wird neu berechnet.
    // Wellenform: zwei überlagerte, überall glatte Funktionen.
    //   basis(x) = Cosinus mit voller Wellenlänge = VIEW_W → permanente
    //              kleine Erhöhungen an beiden Rändern, Senke in der Mitte.
    //   main(x)  = Gauss-Glocke um peakX → wandernder Hauptpeak.
    // Beide sind C^∞-stetig, daher entsteht nirgends ein Knick. Auf Slide 1
    // fällt main mit der linken Basis-Erhöhung zusammen (großer Peak links),
    // die rechte Basis-Erhöhung bleibt als „leicht hoch" erhalten.
    const WAVE_VIEW_W = 1440;
    const WAVE_VIEW_H = 110;
    const WAVE_BASE_Y = 85;        // Y-Basislinie (kein Peak)
    const WAVE_SMALL_AMP = 18;     // permanente Rand-Erhöhungen (Basis-Welle)
    const WAVE_LARGE_AMP = 42;     // wandernder Hauptpeak (Glocke)
    const WAVE_GAUSS_K = 2.5;      // Glockenbreite: kleinere Werte = breiter
    const WAVE_SAMPLES = 200;

    function buildWavePath(ratio) {
        const peakX = ratio * WAVE_VIEW_W;
        let d = '';
        for (let i = 0; i <= WAVE_SAMPLES; i++) {
            const x = (i / WAVE_SAMPLES) * WAVE_VIEW_W;
            const basis = WAVE_SMALL_AMP * (1 + Math.cos(2 * Math.PI * x / WAVE_VIEW_W)) / 2;
            const t = (x - peakX) * WAVE_GAUSS_K / WAVE_VIEW_W;
            const main = WAVE_LARGE_AMP * Math.exp(-t * t);
            const y = WAVE_BASE_Y - basis - main;
            d += (i === 0 ? 'M ' : ' L ') + x.toFixed(2) + ' ' + y.toFixed(2);
        }
        d += ' L ' + WAVE_VIEW_W + ' ' + WAVE_VIEW_H;
        d += ' L 0 ' + WAVE_VIEW_H + ' Z';
        return d;
    }

    function updateWave() {
        const total = Reveal.getTotalSlides();
        const passed = Reveal.getSlidePastCount();
        const ratio = total > 1 ? passed / (total - 1) : 0;
        document.getElementById('wave-path').setAttribute('d', buildWavePath(ratio));
    }
    Reveal.on('ready', updateWave);
    Reveal.on('slidechanged', updateWave);

    // Die Welle lebt in Viewport-Pixeln, die Schutzzone der Folien in Slide-Pixeln.
    // Damit der Wellenkamm auf jedem Beamer auf derselben Slide-Linie liegt, wächst
    // die Welle mit der Reveal-Skalierung; der Letterbox-Rest darunter wird mit der
    // Wellenfarbe gefüllt.
    const WAVE_SLIDE_H = 110;
    function syncWave(scale) {
        if (document.documentElement.classList.contains('reveal-print')) return;
        const wave = document.querySelector('.slide-wave');
        const gap = Math.max(0, (window.innerHeight - 720 * scale) / 2);
        wave.style.height = (WAVE_SLIDE_H * scale + gap) + 'px';
        wave.style.borderBottom = gap + 'px solid rgb(238,231,251)';
    }
    Reveal.on('ready', () => syncWave(Reveal.getScale()));
    Reveal.on('resize', e => syncWave(e.scale));

    // Webfont nachgeladen: Layout einmal neu rechnen, damit Umbrüche stimmen.
    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => Reveal.layout());
    }

    // Debug-Modus (?debug=1): Raster und Schutzzone einzeichnen, Überlauf melden.
    // Gemessen werden die Unterkanten aller Kinder der aktuellen Folie gegen die
    // Oberkante der Schutzzone. Mit ?print-pdf&debug=1&pdfSeparateFragments=false
    // sind alle Folien gleichzeitig sichtbar und das ganze Deck wird geprüft.
    const DEBUG = new URLSearchParams(location.search).has('debug');
    const SAFE_BOTTOM = 120;
    function checkOverflow(sections) {
        const scale = Reveal.getScale();
        sections.forEach(sec => {
            const r = sec.getBoundingClientRect();
            if (!r.height) return;
            // Oberkante der Schutzzone, von der Folienoberkante aus gerechnet (im
            // Print-Modus kollabiert die Section-Höhe, r.bottom wäre dort falsch).
            const limit = r.top + (720 - SAFE_BOTTOM) * scale;
            let maxBottom = -Infinity;
            for (const el of sec.children) {
                if (el.matches('aside.notes')) continue;
                maxBottom = Math.max(maxBottom, el.getBoundingClientRect().bottom);
            }
            const over = maxBottom > limit + 1 || sec.scrollWidth > sec.clientWidth + 1;
            sec.classList.toggle('overflow', over);
            if (over) {
                console.warn('[overflow]', sec.dataset.markdown || JSON.stringify(Reveal.getIndices(sec)),
                    Math.round((maxBottom - limit) / scale) + 'px');
            }
        });
    }
    if (DEBUG) {
        document.documentElement.classList.add('debug-grid');
        Reveal.on('ready', e => checkOverflow([e.currentSlide]));
        Reveal.on('slidechanged', e => checkOverflow([e.currentSlide]));
        Reveal.on('fragmentshown', () => checkOverflow([Reveal.getCurrentSlide()]));
        Reveal.on('pdf-ready', () => checkOverflow([...document.querySelectorAll('.reveal .slides section:not(.stack)')]));
        Reveal.on('ready', () => console.info('[debug] base font-size',
            getComputedStyle(document.querySelector('.reveal')).fontSize));
    }
</script>
